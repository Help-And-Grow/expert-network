# Requires repo secret E2E_DATABASE_URL (Postgres URL for `npm run db:push` + NextAuth/Prisma in CI).
# Optional: E2E_DIRECT_URL — non-pooled Postgres URL (e.g. Supabase port 5432) for Prisma CLI; see prisma.config.ts.
# Supabase transaction pooler (6543 / *.pooler.supabase.com): Prisma needs `pgbouncer=true` on the URL or a direct URL;
# the "Prepare Postgres URLs" step appends `pgbouncer=true` when missing so `db:push` does not fail with prepared statements.
# If unset, later steps are skipped but the job still succeeds (no failure emails).
# Do not use `job.if: secrets.*` here — when the only job is skipped, GitHub can fail the whole workflow with no jobs.

name: UI smoke

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

concurrency:
  group: ui-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      NEXTAUTH_URL: http://localhost:3000
      AUTH_SECRET: playwright-ci-auth-secret-0123456789
      DEV_AUTH_EMAIL: admin-smoke@localhost
      DEV_AUTH_ROLE: ADMIN
    steps:
      - name: Check E2E database secret
        id: e2e
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::E2E_DATABASE_URL is not set — skipping Playwright. Add this repo Actions secret to enable UI smoke."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.e2e.outputs.run == 'true'

      - name: Prepare Postgres URLs for CI (Supabase pooler + Prisma)
        if: steps.e2e.outputs.run == 'true'
        env:
          E2E_DIRECT_URL: ${{ secrets.E2E_DIRECT_URL }}
        run: |
          set -euo pipefail
          append_pgbouncer() {
            local u="$1"
            case "$u" in *pgbouncer=*) printf '%s' "$u"; return ;; esac
            case "$u" in *\?*) printf '%s&pgbouncer=true' "$u" ;; *) printf '%s?pgbouncer=true' "$u" ;; esac
          }
          if [ -n "${E2E_DIRECT_URL:-}" ]; then
            delim="DIRECTURL_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_EOF"
            {
              echo "DIRECT_URL<<$delim"
              printf '%s\n' "$E2E_DIRECT_URL"
              echo "$delim"
            } >> "$GITHUB_ENV"
          fi
          url="${DATABASE_URL}"
          needs=0
          case "$url" in *pooler.supabase.com*) needs=1 ;; esac
          case "$url" in *:6543/*) needs=1 ;; esac
          if [ "$needs" -eq 1 ] && [[ "$url" != *pgbouncer=* ]]; then
            delim="DATABASEURL_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_EOF"
            {
              echo "DATABASE_URL<<$delim"
              append_pgbouncer "$url"
              printf '\n'
              echo "$delim"
            } >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-node@v5
        if: steps.e2e.outputs.run == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.e2e.outputs.run == 'true'
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.e2e.outputs.run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Apply Prisma schema to e2e database
        if: steps.e2e.outputs.run == 'true'
        run: |
          if ! npm run db:push 2>&1; then
            echo "::error::db:push failed. If the error mentions 'tenant/user not found' or 'ENOTFOUND', the Supabase project is paused — resume it at https://supabase.com/dashboard and update the E2E_DATABASE_URL secret."
            exit 1
          fi

      - name: Verify schema is actually applied (catch silent db:push exits)
        if: steps.e2e.outputs.run == 'true'
        # Some hosted Postgres providers (db9.io free tier, Supabase paused projects)
        # let `prisma db push` exit 0 without applying the schema. Without this
        # check, the next step launches Next.js and every API route hits Prisma's
        # P2021 "table does not exist" — the failure mode that hit run 25419668362.
        run: |
          set -euo pipefail
          # Use a one-shot ts-node-free probe via Prisma. If User table doesn't exist,
          # the Prisma client will throw and the step fails with a clear message.
          node -e "
            const { PrismaClient } = require('./src/generated/prisma/client');
            const p = new PrismaClient();
            p.user.findFirst({ select: { id: true } })
              .then(() => { console.log('✓ User table reachable — schema is applied'); process.exit(0); })
              .catch((err) => {
                console.error('✗ Schema verification failed:', err.message || err);
                console.error('');
                console.error('The previous \`db:push\` step exited 0 but the User table is not reachable.');
                console.error('Likely causes:');
                console.error('  • E2E_DATABASE_URL secret points at an ephemeral Postgres that lost its data');
                console.error('  • db:push connected but lacked CREATE TABLE permissions in the target schema');
                console.error('  • E2E_DATABASE_URL and E2E_DIRECT_URL point at different databases');
                console.error('');
                console.error('Action: rotate E2E_DATABASE_URL/E2E_DIRECT_URL to a working Postgres (Cloud SQL e2e instance, Supabase, Neon free tier) and re-run.');
                process.exit(1);
              });
          "

      - name: Run Playwright smoke tests
        if: steps.e2e.outputs.run == 'true'
        run: npm run test:ui

      - name: Upload Playwright report
        if: always() && steps.e2e.outputs.run == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
