# Requires repo secret E2E_DATABASE_URL (Postgres URL for `npm run db:push` + NextAuth/Prisma in CI).
# If unset, later steps are skipped but the job still succeeds (no failure emails).
# Do not use `job.if: secrets.*` here — when the only job is skipped, GitHub can fail the whole workflow with no jobs.

name: UI smoke

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

concurrency:
  group: ui-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      NEXTAUTH_URL: http://localhost:3000
      AUTH_SECRET: playwright-ci-auth-secret-0123456789
      DEV_AUTH_EMAIL: admin-smoke@localhost
      DEV_AUTH_ROLE: ADMIN
    steps:
      - name: Check E2E database secret
        id: e2e
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::E2E_DATABASE_URL is not set — skipping Playwright. Add this repo Actions secret to enable UI smoke."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.e2e.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.e2e.outputs.run == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.e2e.outputs.run == 'true'
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.e2e.outputs.run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Apply Prisma schema to e2e database
        if: steps.e2e.outputs.run == 'true'
        run: npm run db:push

      - name: Run Playwright smoke tests
        if: steps.e2e.outputs.run == 'true'
        run: npm run test:ui

      - name: Upload Playwright report
        if: always() && steps.e2e.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
