# Requires repo secret E2E_DATABASE_URL (Postgres URL for `npm run db:push` + NextAuth/Prisma in CI).
# If unset, the Playwright job is skipped so pushes do not fail the workflow (see job `if:` below).

name: UI smoke

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

concurrency:
  group: ui-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # If this were the only job, an unset secret would skip it and GitHub would fail the workflow
  # with "no jobs" — still triggering failure emails. This job always runs so the workflow succeeds.
  ui-smoke-gate:
    runs-on: ubuntu-latest
    steps:
      - name: E2E database secret
        run: |
          echo "UI smoke: Playwright runs in job playwright-smoke only when E2E_DATABASE_URL is set."
          echo "Add that Actions secret on this repo (and on each fork/mirror that runs this workflow) to enable DB + Playwright."

  playwright-smoke:
    needs: ui-smoke-gate
    # Without this secret the Playwright job is skipped (no false failures from missing DB URL).
    if: ${{ secrets.E2E_DATABASE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      NEXTAUTH_URL: http://localhost:3000
      AUTH_SECRET: playwright-ci-auth-secret-0123456789
      DEV_AUTH_EMAIL: admin-smoke@localhost
      DEV_AUTH_ROLE: ADMIN
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Apply Prisma schema to e2e database
        run: npm run db:push

      - name: Run Playwright smoke tests
        run: npm run test:ui

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
