# Requires repo secret E2E_DATABASE_URL (Postgres URL for `npm run db:push` + NextAuth/Prisma in CI).
# Optional: E2E_DIRECT_URL — non-pooled Postgres URL for Prisma CLI; see prisma.config.ts.
#
# CI database is Cloud SQL (Postgres 16, asia-southeast1) since 2026-05-06 — same
# region as Vercel sin1 functions. Direct connection on 5432, no pooler in front,
# so the pgbouncer auto-append below is a no-op for current secrets but kept for
# Supabase-pooler URLs in case the secrets are ever rotated back.
#
# If unset, later steps are skipped but the job still succeeds (no failure emails).
# Do not use `job.if: secrets.*` here — when the only job is skipped, GitHub can
# fail the whole workflow with no jobs.

name: UI smoke

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

concurrency:
  group: ui-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      NEXTAUTH_URL: http://localhost:3000
      AUTH_SECRET: playwright-ci-auth-secret-0123456789
      DEV_AUTH_EMAIL: admin-smoke@localhost
      DEV_AUTH_ROLE: ADMIN
    steps:
      - name: Check E2E database secret
        id: e2e
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::E2E_DATABASE_URL is not set — skipping Playwright. Add this repo Actions secret to enable UI smoke."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.e2e.outputs.run == 'true'

      - name: Prepare Postgres URLs for CI (Cloud SQL primary; Supabase pooler fallback)
        if: steps.e2e.outputs.run == 'true'
        env:
          E2E_DIRECT_URL: ${{ secrets.E2E_DIRECT_URL }}
        run: |
          set -euo pipefail
          append_pgbouncer() {
            local u="$1"
            case "$u" in *pgbouncer=*) printf '%s' "$u"; return ;; esac
            case "$u" in *\?*) printf '%s&pgbouncer=true' "$u" ;; *) printf '%s?pgbouncer=true' "$u" ;; esac
          }
          if [ -n "${E2E_DIRECT_URL:-}" ]; then
            delim="DIRECTURL_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_EOF"
            {
              echo "DIRECT_URL<<$delim"
              printf '%s\n' "$E2E_DIRECT_URL"
              echo "$delim"
            } >> "$GITHUB_ENV"
          fi
          url="${DATABASE_URL}"
          needs=0
          case "$url" in *pooler.supabase.com*) needs=1 ;; esac
          case "$url" in *:6543/*) needs=1 ;; esac
          if [ "$needs" -eq 1 ] && [[ "$url" != *pgbouncer=* ]]; then
            delim="DATABASEURL_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_EOF"
            {
              echo "DATABASE_URL<<$delim"
              append_pgbouncer "$url"
              printf '\n'
              echo "$delim"
            } >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-node@v5
        if: steps.e2e.outputs.run == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.e2e.outputs.run == 'true'
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.e2e.outputs.run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Apply Prisma schema to e2e database
        if: steps.e2e.outputs.run == 'true'
        run: |
          if ! npm run db:push 2>&1; then
            echo "::error::db:push failed."
            echo ""
            echo "Diagnostic checklist:"
            echo "  • Cloud SQL: confirm 0.0.0.0/0 is in 'Authorized networks' (Vercel/GitHub egress IPs rotate)."
            echo "  • Cloud SQL: confirm the e2e DB user has CREATE TABLE on the target schema."
            echo "  • Supabase (legacy): if the URL still contains *.supabase.com, the project may be paused — resume at https://supabase.com/dashboard."
            echo "  • Connection: 'ENOTFOUND' / 'tenant/user not found' usually means the secret URL is stale."
            exit 1
          fi

      - name: Verify schema is actually applied (catch silent db:push exits)
        if: steps.e2e.outputs.run == 'true'
        # Some hosted Postgres providers (db9.io free tier, Supabase paused projects)
        # let `prisma db push` exit 0 without applying the schema. Without this
        # check, the next step launches Next.js and every API route hits Prisma's
        # P2021 "table does not exist" — the failure mode that hit run 25419668362.
        # Use `prisma db execute` (raw SQL) so we don't depend on the generated TS client.
        run: |
          set -euo pipefail
          if echo 'SELECT 1 FROM "User" LIMIT 1' | npx prisma db execute --stdin --schema=prisma/schema.prisma; then
            echo "✓ User table reachable — schema is applied"
          else
            echo "::error::Schema verification failed: User table not reachable"
            echo ""
            echo "The previous \`db:push\` step exited 0 but the User table is not reachable."
            echo "Likely causes:"
            echo "  • E2E_DATABASE_URL secret points at an ephemeral Postgres that lost its data"
            echo "  • db:push connected but lacked CREATE TABLE permissions in the target schema"
            echo "  • E2E_DATABASE_URL and E2E_DIRECT_URL point at different databases"
            echo ""
            echo "Action: rotate E2E_DATABASE_URL/E2E_DIRECT_URL to a working Postgres"
            echo "(Cloud SQL e2e instance, Supabase, Neon free tier) and re-run."
            exit 1
          fi

      - name: Run Playwright smoke tests
        if: steps.e2e.outputs.run == 'true'
        run: npm run test:ui

      - name: Upload Playwright report
        if: always() && steps.e2e.outputs.run == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
