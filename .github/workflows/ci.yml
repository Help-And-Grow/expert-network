# Lint + Playwright e2e against the canonical production URL. No Vercel
# secrets in GitHub. Solo-PM friendly: one place to see PR health before merge.
#
# `npm run test:e2e:ci` globs e2e/smoke (incl. recent-features.spec.ts),
# e2e/booking, and e2e/auth/signin-page.spec.ts. New smoke specs added under
# e2e/smoke/ are auto-included on next push.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npm run test:e2e:install
      - name: Playwright (smoke paths)
        env:
          # Canonical production URL. The expert-network.vercel.app alias still
          # resolves to the same deployment but is no longer authoritative.
          PLAYWRIGHT_BASE_URL: https://www.help-and-grow.com
        run: npm run test:e2e:ci
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
