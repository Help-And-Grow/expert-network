# Lint + Playwright e2e against the canonical production URL. No Vercel
# secrets in GitHub. Solo-PM friendly: one place to see PR health before merge.
#
# `npm run test:e2e:ci` globs e2e/smoke (incl. recent-features.spec.ts),
# e2e/booking, and e2e/auth/signin-page.spec.ts. New smoke specs added under
# e2e/smoke/ are auto-included on next push.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npm run test:e2e:install
      # Wait for the Vercel deployment of this exact commit to reach "success"
      # before hitting production with Playwright.  Without this guard the e2e
      # job races the Vercel build (~3 min) and new-page tests return 404 from
      # the previous deployment.
      #
      # Uses only the built-in GITHUB_TOKEN (read-only deployments scope) — no
      # extra secrets required.  Times out after 5 min and falls through so a
      # genuine Vercel outage doesn't permanently block CI; the tests will then
      # surface any real failures naturally.
      - name: Wait for Vercel deployment of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.sha }}"
          echo "Waiting up to 5 min for Vercel to deploy $SHA…"
          for i in $(seq 1 30); do
            STATES=$(
              gh api "repos/${{ github.repository }}/deployments?sha=$SHA" \
                --jq '.[].id' 2>/dev/null \
              | while read -r id; do
                  gh api "repos/${{ github.repository }}/deployments/$id/statuses" \
                    --jq 'first | .state' 2>/dev/null
                done
            )
            if echo "$STATES" | grep -qx "success"; then
              echo "✓ Vercel deployment succeeded (attempt $i/30)"
              exit 0
            fi
            echo "Attempt $i/30 – states: $(echo "$STATES" | tr '\n' ' '); retrying in 10 s…"
            sleep 10
          done
          echo "⚠ Timed out after 5 min — proceeding anyway; tests may surface deployment lag"
      - name: Playwright (smoke paths)
        env:
          # Canonical production URL. The expert-network.vercel.app alias still
          # resolves to the same deployment but is no longer authoritative.
          PLAYWRIGHT_BASE_URL: https://www.help-and-grow.com
        run: npm run test:e2e:ci
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
