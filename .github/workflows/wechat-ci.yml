# Build the current international Taro WeChat mini program and upload it via miniprogram-ci.
# You must still assign 体验版 or submit 审核 in the 微信公众平台 — WeChat does not auto-publish to all users.
#
# Setup (once):
#   Repository → Settings → Secrets → Actions:
#     WECHAT_CI_PRIVATE_KEY = full contents of private.wx09d0eb079596060d.key (PEM)
#
name: WeChat mini program upload

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Version label shown in WeChat (e.g. 1.0.8)"
        required: true
        type: string
      description:
        description: "Release notes for this upload"
        required: false
        default: "CI upload"
        type: string

jobs:
  # ── fast build check (always runs, catches SCSS/TS errors before upload) ──
  build-check:
    # Only jlzxwt8/expert-network — the active dev repo with WECHAT_CI_PRIVATE_KEY configured.
    if: github.repository == 'jlzxwt8/expert-network'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: wechat/package-lock.json

      - name: Install deps
        working-directory: wechat
        run: npm ci

      - name: Build intl weapp
        working-directory: wechat
        run: npm run build:weapp:intl

  # ── upload (only runs after build-check passes, and only when key is set) ──
  upload:
    # Only jlzxwt8/expert-network — the active dev repo with WECHAT_CI_PRIVATE_KEY configured.
    if: github.repository == 'jlzxwt8/expert-network'
    needs: build-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: wechat/package-lock.json

      - name: Check WeChat CI secret
        id: wechat_ci_key
        env:
          WECHAT_CI_PRIVATE_KEY: ${{ secrets.WECHAT_CI_PRIVATE_KEY }}
        run: |
          if [ -n "$WECHAT_CI_PRIVATE_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::Missing secret WECHAT_CI_PRIVATE_KEY"
            exit 1
          fi

          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Skipping WeChat upload on push because WECHAT_CI_PRIVATE_KEY is not configured."
          {
            echo "### WeChat upload skipped"
            echo ""
            echo "- Reason: missing \`WECHAT_CI_PRIVATE_KEY\` secret"
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Action: configure the secret to enable automatic uploads on \`main\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install deps
        if: steps.wechat_ci_key.outputs.available == 'true'
        working-directory: wechat
        run: npm ci

      - name: Build intl weapp
        if: steps.wechat_ci_key.outputs.available == 'true'
        working-directory: wechat
        run: npm run build:weapp:intl

      - name: Write CI key
        if: steps.wechat_ci_key.outputs.available == 'true'
        env:
          WECHAT_CI_PRIVATE_KEY: ${{ secrets.WECHAT_CI_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$WECHAT_CI_PRIVATE_KEY" > "${{ runner.temp }}/wechat-ci.key"
          chmod 600 "${{ runner.temp }}/wechat-ci.key"

      - name: Upload to WeChat (with retry)
        if: steps.wechat_ci_key.outputs.available == 'true'
        env:
          WECHAT_CI_KEY_PATH: ${{ runner.temp }}/wechat-ci.key
          WECHAT_REGION: intl
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            DESC="${{ inputs.description }}"
          else
            VERSION="$(node -p "require('./wechat/package.json').version")"
            DESC="main ${GITHUB_SHA::7}"
          fi
          echo "Uploading version: ${VERSION}, desc: ${DESC}"

          for attempt in 1 2 3; do
            echo "--- Upload attempt ${attempt}/3 ---"
            if node scripts/wechat-upload.js "${VERSION}" "${DESC}"; then
              echo "Upload succeeded on attempt ${attempt}"
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "Upload failed, waiting 30s before retry..."
              sleep 30
            fi
          done
          echo "::error::Upload failed after 3 attempts"
          exit 1
